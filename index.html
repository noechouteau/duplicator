        const topY = Math.min(...projected.map(p => p[1]));
        const bottomY = Math.max(...projected.map(p => p[1]));
        const scanY = bottomY + (topY - bottomY) * progress;
        const leftX = Math.min(...projected.map(p => p[0]));
        const rightX = Math.max(...projected.map(p => p[0]));
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        // 1. Fil de fer fantôme : uniquement au-dessus de la vraie ligne de scan.
        ctx.strokeStyle = "rgba(255,255,255,0.28)";
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        mesh.E.forEach(([i, j]) => {
          let a = projected[i], b = projected[j];
          if (a[1] > b[1]) [a, b] = [b, a]; // a = extrémité supérieure
          if (a[1] >= scanY) return;        // arête entièrement scannée
          if (b[1] > scanY) {
            const u = (scanY - a[1]) / (b[1] - a[1]);
            b = [a[0] + (b[0] - a[0]) * u, scanY];
          }
          ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        });
        ctx.setLineDash([]);

        // 2. Faces pleines après le passage de la barre (aucune fuite en perspective).
        const polygons = [];
        mesh.F.forEach(face => {
          const pts = face.map(i => points[i]);
          let normal = cross(sub(pts[1], pts[0]), sub(pts[2], pts[0]));
          const len = Math.hypot(...normal) || 1;
          normal = normal.map(q => q / len);
          const poly = clipBelow(face.map(i => projected[i]), scanY);
          if (poly.length < 3) return;
          const depth = pts.reduce((sum, p) => sum + p[2], 0) / pts.length;
          polygons.push({ poly, depth, normal });
        });
        polygons.sort((a, b) => a.depth - b.depth);

        polygons.forEach(({ poly, normal }) => {
          let color;
          if (normal[2] <= 0) {
            color = [30, 46, 165];   // face arrière (visible à l'intérieur au niveau de la coupe)
          } else {
            // Éclairage : plus la face est tournée vers la lumière, plus elle est claire
            const light = Math.min(1, 0.3 + 0.7 * Math.max(0, dot(normal, LIGHT)));
            color = [40, 60, 200].map(c => Math.round(c + (255 - c) * light));
          }
          const css = "rgb(" + color.join() + ")";
          ctx.fillStyle = css;
          ctx.strokeStyle = css;   // contour de même couleur : masque les coutures entre faces
          ctx.lineWidth = 1;
          ctx.beginPath();
          poly.forEach((p, i) => { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
          ctx.closePath(); ctx.fill(); ctx.stroke();
        });

        // 3. Barre cyan exactement sur la frontière du remplissage (de 0 à 100 %).
        // Elle traverse la silhouette avec une petite marge latérale.
        if (progress < 1) {
          const pad = Math.min(w * .06, 12);
          ctx.strokeStyle = "#8cf3ff";
          ctx.lineWidth = Math.max(1.5, w / 130);
          ctx.beginPath();
          ctx.moveTo(leftX - pad, scanY);
          ctx.lineTo(rightX + pad, scanY);
          ctx.stroke();
        }
      }

      function frame(now) {
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        if (!prefersReducedMotion) angle += dt * 0.9;   // vitesse de rotation
        draw();
        rafId = requestAnimationFrame(frame);
      }

      // API publique du module
      return {
        start(shapeName) {                 // démarre le scan d'une forme ("ico" ou "key")
          mesh = SHAPES[shapeName] || icosahedron;
          progress = 0;
          angle = 0.6;
          canvas.classList.add("visible");
          lastFrame = performance.now();
          if (!rafId) rafId = requestAnimationFrame(frame);
        },
        setProgress(p) { progress = p; },  // 0 → 1
        stop() {                           // arrête et masque
          if (rafId) cancelAnimationFrame(rafId);
          rafId = null;
          canvas.classList.remove("visible");
          progress = 0;
        }
      };
    })();


    // ================= C6. SCÉNARIO DE DUPLICATION =================

    // L'inactivité ne ramène à l'accueil QUE depuis la page prête.
    // Analyse, erreur et résultat restent visibles jusqu'à une action explicite.
    function resetInactivity() {
      if (!screenReady || phase !== "ready") return;
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(returnHome, INACTIVITY_MS);
    }

    function stopProcess() {
      clearInterval(adInterval);
      adInterval = null;
      cancelAnimationFrame(progressFrame);
      progressFrame = null;
    }

    // Nettoyage complet, aussi utilisé lors du retour à l'écran d'accueil.
    function resetDuplication() {
      clearTimeout(inactivityTimer);
      stopProcess();
      analysisTransition?.kill();
      analysisTransition = null;
      phase = "home";
      ingredient.classList.remove("visible");
      invalidMark.classList.remove("visible");
      spinner.classList.remove("visible");
      analysisStatus.classList.remove("visible");
      errorMessage.classList.remove("visible");
      errorTitle.textContent = "";
      errorDetail.textContent = "";
      controls.classList.remove("visible");
      dupButton.hidden = true;
      backButton.hidden = true;
      wire.stop();
      progressWrap.classList.remove("visible");
      success.classList.remove("visible");
      progressFill.style.width = "0%";
      progressValue.textContent = "0%";
      progressWrap.setAttribute("aria-valuenow", "0");
      adMessage.textContent = "";
      currentAdIndex = -1;
      currentErrorReason = null;
      gsap.set(slot, { scale: 1 });
    }

    // Retour vers la page de base, SANS refermer DUPLICATOR ni endormir EMA.
    function backToReady() {
      if (!opened || !screenReady || !["error", "done", "analyzing", "validated"].includes(phase)) return;
      resetDuplication();
      phase = "ready";
      controls.classList.add("visible");
      dupButton.hidden = false;
      say("bulle.attente");
      resetInactivity();
    }

    // Le bouton DUPLIQUER lance maintenant l'analyse, sans objet préalablement détecté.
    function startAnalysis() {
      if (phase !== "ready" || !screenReady) return;
      clearTimeout(inactivityTimer);
      phase = "analyzing";
      dupButton.hidden = true;
      backButton.hidden = true;
      ingredient.classList.remove("visible");
      invalidMark.classList.remove("visible");
      wire.stop();
      analysisStatus.classList.add("visible");
      spinner.classList.add("visible");
      say("bulle.analyse");
    }

    // Réponse positive (F/H ou OSC). Brève animation, puis scan et progression.
    function acceptAnalysis(shape = "ico") {
      if (phase !== "analyzing" || !screenReady) return;
      phase = "validated"; // un seul résultat est accepté par analyse
      currentShape = shape;
      spinner.classList.remove("visible");
      analysisStatus.classList.remove("visible");
      ingredient.classList.add("visible");
      say("bulle.objetDetecte");
      window.emaController?.react("happy");

      analysisTransition?.kill();
      analysisTransition = gsap.timeline({
        onComplete() {
          analysisTransition = null;
          if (phase !== "validated") return;
          ingredient.classList.remove("visible");
          startDuplication();
        }
      });
      analysisTransition.to(slot, {
        scale: 1.08,
        duration: prefersReducedMotion ? 0.01 : 0.23,
        ease: "power2.out"
      });
      analysisTransition.to(slot, {
        scale: 1,
        duration: prefersReducedMotion ? 0.01 : 1.22,
        ease: "back.out(1.8)"
      });
    }

    // Trois erreurs distinctes, avec la même croix animée dans la cuve.
    function rejectAnalysis(reason) {
      if (phase !== "analyzing" || !screenReady) return;
      const config = t("erreurs." + reason);
      if (!config) return;
      currentErrorReason = reason;
      phase = "error";
      spinner.classList.remove("visible");
      analysisStatus.classList.remove("visible");
      errorTitle.textContent = config.titre;
      errorDetail.textContent = config.detail;
      errorMessage.classList.add("visible");
      invalidMark.classList.remove("visible");
      void invalidMark.offsetWidth; // rejouer l'animation en cas d'erreurs successives
      invalidMark.classList.add("visible");
      backButton.hidden = false;
      window.emaController?.react("sad");
      const bubbleForError = {
        vide: "bulle.erreurVide",
        nonDuplicable: "bulle.erreurNonDuplicable",
        multiple: "bulle.erreurMultiple"
      };
      say(bubbleForError[reason] || "erreurs." + reason + ".titre");
    }

    // Pub aléatoire, sans répétition immédiate (même index en FR et EN).
    function showRandomAd() {
      const ads = t("pubs") || [];
      if (!ads.length) return;
      let index = Math.floor(Math.random() * ads.length);
      if (ads.length > 1 && index === currentAdIndex) index = (index + 1) % ads.length;
      currentAdIndex = index;
      adMessage.textContent = ads[index];
    }

    // Une traduction en direct ne change ni le scénario ni la progression.
    window.addEventListener("duplicator:languagechange", () => {
      if (phase === "error" && currentErrorReason) {
        const config = t("erreurs." + currentErrorReason);
        errorTitle.textContent = config?.titre || "";
        errorDetail.textContent = config?.detail || "";
      }

      if (currentAdIndex !== -1) {
        adMessage.textContent = t("pubs")?.[currentAdIndex] || "";
      }

      if (bubbleOn && bubblePath) {
        // Remplace immédiatement le texte d'EMA sans relancer son animation.
        clearInterval(typeTimer);
        gsap.killTweensOf(bubbleBox);
        const message = t(bubblePath) ?? "";
        bubbleGhost.textContent = message + "_";
        bubbleTyped.textContent = message;
        gsap.set(bubbleBox, { scale: 1, opacity: 1 });
      }
    });

    // Lancement automatique APRÈS validation de l'analyse.
    function startDuplication() {
      if (phase !== "validated" || !screenReady) return;
      phase = "processing";
      ingredient.classList.remove("visible");
      wire.start(currentShape);
      say("bulle.patienter");
      progressWrap.classList.add("visible");
      showRandomAd();
      adInterval = setInterval(showRandomAd, 2200);

      const startTime = performance.now();
      function renderProgress(now) {
        if (phase !== "processing") return;
        const ratio = Math.min(1, (now - startTime) / DUPLICATION_MS);
        const eased = 1 - Math.pow(1 - ratio, 1.35);
        const percent = Math.round(eased * 100);
        progressFill.style.width = percent + "%";
        progressValue.textContent = percent + "%";
        progressWrap.setAttribute("aria-valuenow", String(percent));
        wire.setProgress(eased);

        if (ratio < 1) {
          progressFrame = requestAnimationFrame(renderProgress);
          return;
        }

        stopProcess();
        phase = "done";
        progressWrap.classList.remove("visible");
        success.classList.add("visible");
        backButton.hidden = false;
        say("bulle.termine");
      }
      progressFrame = requestAnimationFrame(renderProgress);
    }

    dupButton.addEventListener("click", event => {
      event.stopPropagation();
      startAnalysis();
    });

    backButton.addEventListener("click", event => {
      event.stopPropagation();
      backToReady();
    });

    // Touches reconnues UNIQUEMENT pendant l'analyse.
    // F/H = objet valide ; G/V/M = les trois cas d'erreur.
    document.addEventListener("keydown", event => {
      if (event.repeat || event.ctrlKey || event.altKey || event.metaKey ||
          /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
      const key = event.key.toLowerCase();
      if (key === "r" && ["analyzing", "error", "done"].includes(phase)) {
        backToReady();  // raccourci technique facultatif
        return;
      }
      if (phase !== "analyzing") return;
      if (key === "f") acceptAnalysis("ico");
      if (key === "h") acceptAnalysis("key");
      if (key === "g") rejectAnalysis("nonDuplicable");
      if (key === "v") rejectAnalysis("vide");
      if (key === "m") rejectAnalysis("multiple");
    });

    // Activité tactile/souris : remet à zéro la veille de la page prête.
    ["pointermove", "pointerdown", "keydown", "touchstart", "wheel"].forEach(name => {
      document.addEventListener(name, resetInactivity, { passive: true });
    });


    // ================= C7. ANIMATION D'OUVERTURE / RETOUR À L'ACCUEIL =================

    gsap.set(tagPos, { transformOrigin: "50% 0%" });
    gsap.set(slot, { opacity: 0, scale: 0.6 });

    // Calcule les positions finales (indépendamment des transformations en cours) :
    //   - échelle et décalage vertical du titre
    //   - position des deux cadres de relevés (empilés à droite, au milieu)
    function computeTargets() {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const baseCenterY = wrap.offsetTop + wrap.offsetHeight / 2;
      // Le titre réduit ne doit plus être plafonné à 440px sur une dalle 2160×1440.
      const isLarge3by2 = viewportWidth >= 2000 && viewportHeight >= 1300
        && viewportWidth / viewportHeight >= 1.4 && viewportWidth / viewportHeight <= 1.6;
      const targetWidth = Math.max(180, Math.min(isLarge3by2 ? 720 : 440, viewportWidth * 0.3));
      const titleScale = Math.min(0.6, targetWidth / wrap.offsetWidth);
      const clockHeight = tagSvg.getBoundingClientRect().height;
      const titleHeight = wrap.offsetHeight * titleScale;
      const targetCenterY = 30 + clockHeight * 1.15 + titleHeight / 2;
      const titleBottom = targetCenterY + titleHeight / 2;

      // Colonne des materiaux : 10 % de marge sur une dalle 3:2.
      // Les bornes garantissent que les cadres restent DANS le viewport,
      // y compris quand leur largeur change avec la langue ou le redimensionnement.
      const gap = 18;
      const rightMargin = Math.max(44, Math.min(190, viewportWidth * 0.10));
      const bottomMargin = Math.max(35, viewportHeight * 0.06);
      const visibleBoxes = boxes.filter(b => b.offsetParent !== null);
      const groupHeight = visibleBoxes.reduce((sum, b) => sum + b.getBoundingClientRect().height, 0)
        + gap * Math.max(0, visibleBoxes.length - 1);
      let top = Math.min(
        Math.max(titleBottom + 20, viewportHeight / 2 - groupHeight / 2),
        Math.max(22, viewportHeight - bottomMargin - groupHeight)
      );

      const boxTargets = boxes.map(b => {
        if (b.offsetParent === null) return null;
        const rect = b.getBoundingClientRect();
        const desiredLeft = Math.max(18,
          Math.min(viewportWidth - rect.width - 18,
            viewportWidth - rightMargin - rect.width));
        const desiredTop = Math.max(18,
          Math.min(viewportHeight - rect.height - 18, top));

        // Le rectangle mesure la position REELLE, avec transformation GSAP.
        // On ajoute la translation deja appliquee pour obtenir une cible absolue
        // sans cumuler les offsets (origine du bug de glissement hors ecran).
        const currentX = Number(gsap.getProperty(b, 'x')) || 0;
        const currentY = Number(gsap.getProperty(b, 'y')) || 0;
        const result = {
          x: currentX + desiredLeft - rect.left,
          y: currentY + desiredTop - rect.top
        };
        top += rect.height + gap;
        return result;
      });
      return { titleScale, titleDy: targetCenterY - baseCenterY, boxes: boxTargets };
    }

    // Clic sur l'écran d'accueil : ouverture
    function openUp() {
      if (opened) return;
      opened = true;
      document.body.classList.add("is-open");   // masque l'indicateur tactile
      document.body.style.cursor = "default";
      window.emaController?.wake();

      const T = computeTargets();
      const progressTween = { v: 0 };   // valeur animée de 0 à 1, qui pilote le titre

      const tl = gsap.timeline({
        onComplete() {
          screenReady = true;
          phase = "ready";
          controls.classList.add("visible");
          dupButton.hidden = false;
          say("bulle.attente");
          resetInactivity();
        }
      });
      transition = tl;

      // 1. Le titre rapetisse et monte ; l'horloge garde sa taille (on annule le zoom)
      tl.to(progressTween, {
        v: 1,
        duration: 1.1,
        ease: "power3.inOut",
        onUpdate() {
          const s = 1 + (T.titleScale - 1) * progressTween.v;
          gsap.set(wrap, { scale: s, y: T.titleDy * progressTween.v });
          gsap.set(tagPos, { scale: 1 / s });
        }
      });

      // 2. Les cadres de relevés glissent à droite, l'un après l'autre
      boxes.forEach((b, i) => {
        if (!T.boxes[i]) return;
        tl.to(b, { x: T.boxes[i].x, y: T.boxes[i].y, duration: 0.9, ease: "power3.inOut" }, 0.35 + i * 0.12);
      });

      // 3. Le carré vide apparaît
      tl.to(slot, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.8)" }, "+=0.35");

      if (prefersReducedMotion) tl.timeScale(50);   // quasi instantané
    }

    // Retour à l'accueil : on rejoue l'animation d'ouverture à l'envers
    function returnHome() {
      if (!opened || !transition || phase !== "ready") return;
      screenReady = false;
      hideBubble();
      clearTimeout(inactivityTimer);
      window.emaController?.sleep();
      resetDuplication();

      transition.eventCallback("onReverseComplete", () => {
        opened = false;
        document.body.classList.remove("is-open");
        document.body.style.cursor = "pointer";
        requestAnimationFrame(positionTouchHint);
        // On efface les styles posés par GSAP pour retrouver l'état de départ
        gsap.set([wrap, tagPos, ...boxes, slot], { clearProps: "all" });
        gsap.set(tagPos, { transformOrigin: "50% 0%" });
        gsap.set(slot, { opacity: 0, scale: 0.6 });
      });
      transition.reverse();
    }

    // Si la fenêtre change de taille, on recale tout
    addEventListener("resize", () => {
      if (!opened) { positionTouchHint(); return; }
      const T = computeTargets();
      gsap.set(wrap, { scale: T.titleScale, y: T.titleDy });
      gsap.set(tagPos, { scale: 1 / T.titleScale });
      boxes.forEach((b, i) => {
        if (T.boxes[i]) gsap.set(b, { x: T.boxes[i].x, y: T.boxes[i].y });
      });
    });

    // Un clic n'importe où ouvre l'écran
    document.addEventListener("click", openUp);

    function connectOsc() {
      const socket = new WebSocket("ws://127.0.0.1:8081");

      socket.addEventListener("open", () => {
        console.log("OSC connecté !");
      });

      socket.addEventListener("message", event => {
        try {
          const data = JSON.parse(event.data);

          switch (data.action) {
            case "ico":
              acceptAnalysis("ico");
              break;

            case "key":
              acceptAnalysis("key");
              break;

            case "invalid":
              rejectAnalysis("nonDuplicable");
              break;

            case "empty":
              rejectAnalysis("vide");
              break;

            case "multiple":
              rejectAnalysis("multiple");
              break;

            case "open":
              openUp();
              break;

            case "duplicate":
              startAnalysis();
              break;

            case "back":
              backToReady();
              break;
          }
        } catch (error) {
          console.error("Message invalide :", error);
        }
      });

      socket.addEventListener("close", () => {
        console.warn("OSC déconnecté, reconnexion...");
        setTimeout(connectOsc, 2000);
      });

      socket.addEventListener("error", () => {
        socket.close();
      });
    }

    connectOsc();

  }
  </script>
</body>
